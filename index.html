<section class="live-status">
  <div class="status-title">
    <span class="live-dot"></span>
    카원 실시간 견적 현황
  </div>

  <div class="status-grid">
    <div class="status-item">
      <strong class="counter" data-target="287">0</strong>
      <span>실시간 견적문의</span>
    </div>

    <div class="divider"></div>

    <div class="status-item">
      <strong class="counter" data-target="1436">0</strong>
      <span>누적 매칭 현황</span>
    </div>
  </div>

  <p class="live-message">
    지금도 새로운 견적이 접수되고 있습니다
  </p>
</section>

<style>
.live-status {
  max-width: 700px;
  margin: 40px auto;
  padding: 35px;
  border-radius: 24px;
  background: #ffffff;
  box-shadow: 0 10px 35px rgba(0,0,0,0.08);
  font-family: Arial, sans-serif;
  text-align: center;
}

.status-title {
  font-size: 17px;
  font-weight: 700;
  color: #333;
  margin-bottom: 28px;
}

.live-dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  margin-right: 7px;
  border-radius: 50%;
  background: #26e0b3;
  animation: blink 1.3s infinite;
}

.status-grid {
  display: flex;
  align-items: center;
  justify-content: center;
}

.status-item {
  width: 45%;
}

.counter {
  display: block;
  font-size: 44px;
  font-weight: 800;
  color: #111;
  margin-bottom: 8px;
}

.counter::after {
  content: "건";
  font-size: 18px;
  margin-left: 3px;
}

.status-item span {
  font-size: 15px;
  color: #777;
}

.divider {
  width: 1px;
  height: 60px;
  background: #ddd;
}

.live-message {
  margin-top: 25px;
  font-size: 13px;
  color: #999;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.25; }
}
</style>

<script>
const counters = document.querySelectorAll('.counter');

counters.forEach(counter => {
  const target = Number(counter.dataset.target);
  const duration = 1500;
  const startTime = performance.now();

  function update(currentTime) {
    const progress = Math.min((currentTime - startTime) / duration, 1);
    const value = Math.floor(progress * target);

    counter.textContent = value.toLocaleString();

    if (progress < 1) {
      requestAnimationFrame(update);
    }
  }

  requestAnimationFrame(update);
});
</script>
