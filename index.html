<script>
  const SUPABASE_URL = "https://ywtlrqmlzzstlpkianxk.supabase.co";

  const SUPABASE_KEY = "sb_publishable_SJLMDHI1M8xHu64hThJOsw_RAmsmJY_";


  async function loadStats() {

    try {

      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/carone_stats?id=eq.1&select=live_count,total_count`,
        {
          headers: {
            apikey: SUPABASE_KEY
          }
        }
      );


      if (!response.ok) {
        throw new Error(
          `데이터 요청 실패: ${response.status}`
        );
      }


      const data = await response.json();


      if (!data || data.length === 0) {
        throw new Error("통계 데이터가 없습니다.");
      }


      const liveCount =
        data[0].live_count;

      const totalCount =
        data[0].total_count;


      animateCounter(
        document.querySelector(".purple-number"),
        liveCount
      );


      animateCounter(
        document.querySelector(".mint-number"),
        totalCount
      );

    }

    catch (error) {

      console.error(
        "카원 통계 불러오기 실패:",
        error
      );

    }

  }


  function animateCounter(element, target) {

    if (!element) return;


    const duration = 1600;

    const startTime =
      performance.now();


    function update(currentTime) {

      const progress =
        Math.min(
          (currentTime - startTime) / duration,
          1
        );


      const ease =
        1 - Math.pow(1 - progress, 4);


      const value =
        Math.floor(target * ease);


      element.textContent =
        value.toLocaleString("ko-KR");


      if (progress < 1) {

        requestAnimationFrame(update);

      }

      else {

        element.textContent =
          target.toLocaleString("ko-KR");

      }

    }


    requestAnimationFrame(update);

  }


  loadStats();
</script>
