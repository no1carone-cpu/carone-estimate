<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: transparent;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
    }

    body {
      padding: 15px;
    }

    .carone-live {
      position: relative;
      max-width: 850px;
      margin: 0 auto;
      padding: 38px 45px 32px;
      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          #f5f0ff 0%,
          #ffffff 48%,
          #edfff9 100%
        );

      border: 1px solid rgba(116, 87, 213, 0.13);
      border-radius: 28px;

      box-shadow:
        0 14px 40px rgba(91, 69, 158, 0.10);
    }

    /* 연보라 장식 */
    .carone-live::before {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      top: -105px;
      right: -55px;

      border-radius: 50%;

      background:
        rgba(124, 92, 218, 0.08);
    }

    /* 민트 장식 */
    .carone-live::after {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      bottom: -105px;
      left: -55px;

      border-radius: 50%;

      background:
        rgba(47, 218, 177, 0.10);
    }

    .live-header {
      position: relative;
      z-index: 2;

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;

      margin-bottom: 32px;

      font-size: 17px;
      font-weight: 750;
      color: #453870;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      padding: 6px 11px;

      border-radius: 20px;

      background:
        linear-gradient(
          135deg,
          #7657d8,
          #8d70e5
        );

      color: #ffffff;

      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;

      box-shadow:
        0 4px 12px rgba(118, 87, 216, 0.22);
    }

    .live-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #62f4cc;

      box-shadow:
        0 0 9px rgba(98, 244, 204, 0.95);

      animation: pulse 1.4s infinite;
    }

    .status-grid {
      position: relative;
      z-index: 2;

      display: grid;
      grid-template-columns: 1fr 1px 1fr;

      align-items: center;
      gap: 30px;
    }

    .status-item {
      text-align: center;
    }

    .counter-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 4px;
    }

    .counter {
      display: inline-block;

      font-size: 50px;
      line-height: 1;

      font-weight: 850;
      letter-spacing: -2px;
    }

    /* 실시간 문의 = 보라 */
    .purple-number {
      color: #7052d4;
    }

    /* 누적 문의 = 민트 */
    .mint-number {
      color: #24b995;
    }

    .unit {
      font-size: 17px;
      font-weight: 700;

      color: #555064;
    }

    .status-label {
      display: block;

      margin-top: 11px;

      font-size: 14px;
      font-weight: 650;

      color: #777181;
    }

    .divider {
      width: 1px;
      height: 70px;

      background:
        linear-gradient(
          to bottom,
          transparent,
          #dcd6ec,
          transparent
        );
    }

    .live-message {
      position: relative;
      z-index: 2;

      margin: 30px 0 0;

      text-align: center;

      font-size: 13px;
      color: #8b8597;
    }

    .live-message strong {
      color: #6951bd;
      font-weight: 750;
    }

    @keyframes pulse {

      0% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.3;
        transform: scale(0.72);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }

    }

    /* 모바일 */
    @media (max-width: 600px) {

      body {
        padding: 10px;
      }

      .carone-live {
        padding: 28px 16px 25px;
        border-radius: 22px;
      }

      .live-header {
        margin-bottom: 27px;

        font-size: 14px;
      }

      .status-grid {
        gap: 10px;
      }

      .counter {
        font-size: 36px;
        letter-spacing: -1px;
      }

      .unit {
        font-size: 14px;
      }

      .status-label {
        font-size: 12px;
      }

      .divider {
        height: 55px;
      }

      .live-message {
        margin-top: 25px;

        font-size: 12px;
        line-height: 1.6;
      }

    }
  </style>
</head>

<body>

  <section class="carone-live">

    <div class="live-header">

      <div class="live-badge">
        <span class="live-dot"></span>
        LIVE
      </div>

      <span>카원 실시간 견적 현황</span>

    </div>


    <div class="status-grid">

      <!-- 실시간 견적문의 -->
      <div class="status-item">

        <div class="counter-row">

          <strong
            class="counter purple-number"
            data-target="56"
          >0</strong>

          <span class="unit">건</span>

        </div>

        <span class="status-label">
          실시간 견적문의
        </span>

      </div>


      <div class="divider"></div>


      <!-- 누적 견적문의 -->
      <div class="status-item">

        <div class="counter-row">

          <strong
            class="counter mint-number"
            data-target="295"
          >0</strong>

          <span class="unit">건</span>

        </div>

        <span class="status-label">
          누적 견적문의
        </span>

      </div>

    </div>


    <p class="live-message">
      <strong>카원</strong>에서는 지금도
      새로운 신차 견적이 접수되고 있습니다.
    </p>

  </section>


  <script>

    const counters =
      document.querySelectorAll(".counter");


    counters.forEach(counter => {

      const target =
        Number(counter.dataset.target);

      const duration = 1600;

      const startTime =
        performance.now();


      function update(currentTime) {

        const progress =
          Math.min(
            (currentTime - startTime) / duration,
            1
          );


        /* 자연스러운 감속 효과 */
        const ease =
          1 - Math.pow(1 - progress, 4);


        const value =
          Math.floor(target * ease);


        counter.textContent =
          value.toLocaleString("ko-KR");


        if (progress < 1) {

          requestAnimationFrame(update);

        } else {

          /* 마지막 숫자 정확하게 고정 */
          counter.textContent =
            target.toLocaleString("ko-KR");

        }

      }


      requestAnimationFrame(update);

    });

  </script>

</body>
</html>
