<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>카원 신차견적 | 차량 선택</title>
<style>
    * { box-sizing: border-box; }

    :root {
      --purple: #4b2586;
      --purple-2: #6d49aa;
      --purple-soft: #f5f1fb;
      --mint: #16e5df;
      --mint-soft: #eafffd;
      --ink: #17151d;
      --text: #4d4853;
      --muted: #918b97;
      --line: #e8e4eb;
      --bg: #f7f7f9;
      --white: #fff;
    }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Arial, sans-serif;
      letter-spacing: -0.025em;
    }

    button, input { font: inherit; }

    .wrap {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 18px 42px;
    }

    .intro {
      padding: 24px 6px 20px;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 10px;
      color: var(--purple);
      font-size: 11px;
      font-weight: 950;
      letter-spacing: .09em;
    }

    .kicker::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 0 4px rgba(22,229,223,.12);
    }

    .intro h1 {
      margin: 0;
      font-size: clamp(29px, 4vw, 44px);
      letter-spacing: -0.055em;
      line-height: 1.15;
    }

    .intro p {
      margin: 12px 0 0;
      color: var(--text);
      font-size: 15px;
      line-height: 1.65;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 0 16px;
      background: linear-gradient(
        to bottom,
        rgba(247,247,249,1) 75%,
        rgba(247,247,249,0)
      );
    }

    .tabs {
      display: inline-flex;
      gap: 6px;
      padding: 5px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 5px 18px rgba(38,27,48,.04);
    }

    .tab {
      border: 0;
      background: transparent;
      padding: 10px 17px;
      border-radius: 10px;
      color: #77717c;
      font-size: 13px;
      font-weight: 850;
      cursor: pointer;
      transition: .18s ease;
    }

    .tab.active {
      background: var(--purple);
      color: #fff;
      box-shadow: 0 6px 16px rgba(75,37,134,.18);
    }

    .count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .section {
      margin-top: 10px;
    }

    .section-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 15px;
      margin: 0 3px 13px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 19px;
      letter-spacing: -0.04em;
    }

    .section-heading span {
      color: var(--muted);
      font-size: 11px;
    }

    .car-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 13px;
    }

    .car-card {
      position: relative;
      overflow: hidden;
      min-width: 0;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(33,25,41,.035);
      transition: .2s ease;
    }

    .car-card[data-ready="true"] {
      cursor: pointer;
    }

    .car-card[data-ready="true"]:hover {
      transform: translateY(-3px);
      border-color: #c8b9db;
      box-shadow: 0 12px 28px rgba(75,37,134,.09);
    }

    .car-card.hide {
      display: none;
    }

    .image-box {
      position: relative;
      height: 174px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 70%, rgba(75,37,134,.09), transparent 30%),
        linear-gradient(155deg, #fbfbfc, #f0f1f4);
      border-bottom: 1px solid #f0edf2;
    }

    .car-img {
      width: 92%;
      height: 92%;
      object-fit: contain;
      display: none;
      position: relative;
      z-index: 2;
    }

    .placeholder {
      text-align: center;
      color: #bbb6bf;
      position: relative;
      z-index: 2;
      padding: 16px;
    }

    .placeholder .icon {
      display: block;
      font-size: 58px;
      margin-bottom: 2px;
      filter: grayscale(.35);
      opacity: .72;
    }

    .placeholder small {
      font-size: 10px;
      font-weight: 700;
    }

    .status-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 5;
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 9px;
      font-weight: 950;
      letter-spacing: .03em;
    }

    .status-badge.ready {
      background: var(--mint-soft);
      color: #087c79;
      border: 1px solid rgba(8,124,121,.12);
    }

    .status-badge.soon {
      background: rgba(255,255,255,.9);
      color: #918b97;
      border: 1px solid #e5e1e7;
      backdrop-filter: blur(6px);
    }

    .card-body {
      padding: 17px 18px 18px;
    }

    .brand {
      color: var(--purple);
      font-size: 9px;
      font-weight: 950;
      letter-spacing: .12em;
      margin-bottom: 5px;
    }

    .car-name {
      margin: 0;
      min-height: 52px;
      font-size: 19px;
      line-height: 1.35;
      letter-spacing: -0.045em;
      word-break: keep-all;
    }

    .car-type {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 15px;
      padding-top: 13px;
      border-top: 1px solid #f1eef3;
    }

    .link-text {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .car-card[data-ready="true"] .link-text {
      color: var(--purple);
    }

    .arrow {
      width: 29px;
      height: 29px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: #f3f0f6;
      color: #9b91a5;
      font-size: 14px;
      font-weight: 950;
      transition: .18s ease;
    }

    .car-card[data-ready="true"] .arrow {
      background: var(--purple);
      color: #fff;
    }

    .car-card[data-ready="true"]:hover .arrow {
      transform: translateX(2px);
      background: var(--purple-2);
    }

    .footer-note {
      margin-top: 20px;
      padding: 15px 17px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.65;
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 50;
      transform: translate(-50%, 25px);
      max-width: calc(100vw - 34px);
      padding: 12px 17px;
      border-radius: 12px;
      background: #1e1925;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: .22s ease;
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 820px) {
      .wrap {
        padding: 15px 11px 28px;
      }

      .intro {
        padding: 17px 4px 14px;
      }

      .intro p {
        font-size: 13px;
      }

      .toolbar {
        padding-top: 7px;
      }

      .car-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
      }

      .image-box {
        height: 145px;
      }

      .card-body {
        padding: 14px 14px 15px;
      }

      .car-name {
        min-height: 44px;
        font-size: 16px;
      }

      .section-heading {
        margin-bottom: 10px;
      }
    }

    @media (max-width: 480px) {
      .wrap {
        padding-left: 8px;
        padding-right: 8px;
      }

      .intro h1 {
        font-size: 28px;
      }

      .toolbar {
        align-items: flex-start;
      }

      .tabs {
        gap: 3px;
        padding: 4px;
      }

      .tab {
        padding: 9px 13px;
        font-size: 12px;
      }

      .count {
        padding-top: 10px;
        font-size: 10px;
      }

      .image-box {
        height: 122px;
      }

      .placeholder .icon {
        font-size: 45px;
      }

      .status-badge {
        top: 8px;
        right: 8px;
        padding: 5px 7px;
        font-size: 8px;
      }

      .card-body {
        padding: 12px;
      }

      .car-name {
        min-height: 42px;
        font-size: 15px;
      }

      .car-type {
        min-height: 14px;
        font-size: 10px;
      }

      .card-bottom {
        margin-top: 11px;
        padding-top: 10px;
      }

      .link-text {
        font-size: 10px;
      }

      .arrow {
        width: 25px;
        height: 25px;
        border-radius: 8px;
      }
    }
  </style>
</head>
<body>
<main class="wrap">
<section class="intro">
<div class="kicker">CARONE SMART ESTIMATE</div>
<h1>어떤 차량을<br/>알아보고 계신가요?</h1>
<p>
      원하는 현대·제네시스·기아 차량을 선택하면 트림과 옵션을 직접 구성하고
      카원 계약 혜택까지 한 번에 확인할 수 있습니다.
    </p>
</section>
<div class="toolbar">
<div aria-label="브랜드 필터" class="tabs">
<button class="tab active" data-filter="all">전체</button>
<button class="tab" data-filter="hyundai">현대</button>
<button class="tab" data-filter="kia">기아</button>
</div>
<div class="count">
<span id="visibleCount">39</span>개 차량
    </div>
</div>
<section class="section">
<div class="section-heading">
<h2 id="sectionTitle">현대 · 제네시스 · 기아 차량</h2>
<span>차량을 선택해주세요</span>
</div>
<div class="car-grid" id="carGrid">
<!-- js/cars.js의 CAR_DATA에서 자동 생성됩니다. -->
</div>
</section>
<div class="footer-note">
    차량별 세부 가격과 선택품목은 각 견적 페이지에서 확인할 수 있습니다.
    준비중인 차종은 순차적으로 추가됩니다.
  </div>
</main>
<div class="toast" id="toast"></div>


<script src="js/cars.js"></script>
<script>
  const tabs = document.querySelectorAll(".tab");
  const carGrid = document.getElementById("carGrid");
  const visibleCount = document.getElementById("visibleCount");
  const sectionTitle = document.getElementById("sectionTitle");
  const toastEl = document.getElementById("toast");

  function showToast(message) {
    toastEl.textContent = message;
    toastEl.classList.add("show");

    clearTimeout(window.caroneToastTimer);
    window.caroneToastTimer = setTimeout(() => {
      toastEl.classList.remove("show");
    }, 2200);
  }

  function normalizeBrand(brand) {
    const value = String(brand || "").toUpperCase();

    if (value === "KIA") return "kia";
    if (value === "GENESIS") return "genesis";
    return "hyundai";
  }

  function filterBrand(brand) {
    return normalizeBrand(brand) === "kia" ? "kia" : "hyundai";
  }

  function getIcon(car) {
    const text = [
      car?.displayName,
      car?.name,
      car?.type,
      car?.engineHelp
    ].filter(Boolean).join(" ").toLowerCase();

    if (text.includes("수소")) return "💧";
    if (
      text.includes("electric") ||
      text.includes("전기") ||
      text.includes("ev")
    ) return "⚡";
    if (text.includes("rv") || text.includes("카니발")) return "🚐";
    if (text.includes("세단")) return "🚘";
    return "🚙";
  }

  function makeCard({
    key = "",
    brand = "",
    title = "",
    type = "",
    image = "",
    ready = true,
    url = "",
    icon = ""
  }) {
    const article = document.createElement("article");

    article.className = "car-card";
    article.dataset.brand = normalizeBrand(brand);
    article.dataset.filterBrand = filterBrand(brand);
    article.dataset.name = title;
    article.dataset.ready = ready ? "true" : "false";

    if (ready) {
      article.dataset.url =
        url || `estimate.html?car=${encodeURIComponent(key)}`;
    }

    article.innerHTML = `
      <div class="image-box">
        <img class="car-img" src="${image || ""}" alt="${title}">
        <div class="placeholder">
          <span class="icon">${icon || "🚙"}</span>
          <small>${ready ? title : "차량 이미지 준비중"}</small>
        </div>
        <span class="status-badge ${ready ? "ready" : "soon"}">
          ${ready ? "견적 가능" : "준비중"}
        </span>
      </div>

      <div class="card-body">
        <div class="brand">${String(brand || "").toUpperCase()}</div>
        <h3 class="car-name">${title}</h3>
        <div class="car-type">${type || ""}</div>
        <div class="card-bottom">
          <span class="link-text">${ready ? "견적 만들기" : "견적 준비중"}</span>
          <span class="arrow">›</span>
        </div>
      </div>
    `;

    article.addEventListener("click", () => {
      if (ready) {
        window.location.href = article.dataset.url;
      } else {
        showToast(`${title} 견적은 현재 준비중입니다.`);
      }
    });

    const img = article.querySelector(".car-img");
    const placeholder = article.querySelector(".placeholder");

    const showImage = () => {
      img.style.display = "block";
      placeholder.style.display = "none";
    };

    const showPlaceholder = () => {
      img.style.display = "none";
      placeholder.style.display = "block";
    };

    img.addEventListener("load", showImage);
    img.addEventListener("error", showPlaceholder);

    if (img.complete) {
      if (img.naturalWidth > 0) showImage();
      else showPlaceholder();
    }

    return article;
  }

  function getOrderedKeys() {
    const data = window.CAR_DATA || {};
    const keys = Object.keys(data);
    const preferred = Array.isArray(window.CAR_DISPLAY_ORDER)
      ? window.CAR_DISPLAY_ORDER
      : [];

    return [
      ...preferred.filter(key => keys.includes(key)),
      ...keys.filter(key => !preferred.includes(key))
    ];
  }

  function renderCatalog() {
    const data = window.CAR_DATA || {};
    const meta = window.CAR_CATALOG_META || {};
    const special = window.CAR_SPECIAL_CARDS || {};

    carGrid.innerHTML = "";

    getOrderedKeys().forEach(key => {
      const car = data[key];
      if (!car) return;

      const brand = car.brand || "HYUNDAI";
      const cardMeta = meta[key] || {};

      if (Array.isArray(special[key]) && special[key].length) {
        special[key].forEach(item => {
          carGrid.appendChild(makeCard({
            key,
            brand,
            title: item.title || car.displayName || car.name || key,
            type: item.type || car.type || "",
            image: item.image || car.image || "",
            ready: true,
            url: item.url || `estimate.html?car=${encodeURIComponent(key)}`,
            icon: item.icon || getIcon(car)
          }));
        });
        return;
      }

      carGrid.appendChild(makeCard({
        key,
        brand,
        title:
          cardMeta.title ||
          car.catalogTitle ||
          car.displayName ||
          car.name ||
          key,
        type:
          cardMeta.type ||
          car.catalogType ||
          car.type ||
          "",
        image:
          cardMeta.image ||
          car.image ||
          "",
        ready: true,
        url:
          cardMeta.url ||
          `estimate.html?car=${encodeURIComponent(key)}`,
        icon:
          cardMeta.icon ||
          getIcon(car)
      }));
    });

    (window.CAR_PENDING || []).forEach(item => {
      carGrid.appendChild(makeCard({
        brand: item.brand,
        title: item.displayName,
        type: item.type,
        image: item.image,
        ready: false,
        icon: item.icon
      }));
    });

    applyFilter(
      document.querySelector(".tab.active")?.dataset.filter || "all"
    );
  }

  function applyFilter(filter) {
    const cards = document.querySelectorAll(".car-card");
    let count = 0;

    cards.forEach(card => {
      const visible =
        filter === "all" ||
        card.dataset.filterBrand === filter;

      card.classList.toggle("hide", !visible);

      if (visible) count++;
    });

    visibleCount.textContent = count;

    if (filter === "hyundai") {
      sectionTitle.textContent = "현대 · 제네시스";
    } else if (filter === "kia") {
      sectionTitle.textContent = "기아";
    } else {
      sectionTitle.textContent = "현대 · 제네시스 · 기아 차량";
    }
  }

  tabs.forEach(tab => {
    tab.addEventListener("click", () => {
      tabs.forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      applyFilter(tab.dataset.filter);
    });
  });

  if (!window.CAR_DATA) {
    carGrid.innerHTML = `
      <div style="grid-column:1/-1;padding:30px;text-align:center;color:#918b97;">
        차량 데이터를 불러오지 못했습니다.<br>
        js/cars.js 경로를 확인해주세요.
      </div>
    `;
  } else {
    renderCatalog();
  }
</script>
</body>
</html>
