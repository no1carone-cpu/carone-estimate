<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>카원 | 내 견적문의</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f9;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#19171d}.page{max-width:900px;margin:auto;padding:35px 14px 60px}
header{text-align:center;margin-bottom:22px}header small{color:#4b2586;font-weight:900;letter-spacing:.12em}h1{font-size:36px;margin:7px 0}header p{color:#89828e;font-size:12px;line-height:1.7}
.login,.card{background:#fff;border:1px solid #e8e3eb;border-radius:18px}.login{max-width:620px;margin:auto;padding:20px;box-shadow:0 12px 38px #3223410f}.login h2{font-size:16px;margin:0 0 5px}.desc{font-size:10px;color:#89828e;margin-bottom:14px}
form{display:grid;grid-template-columns:1fr .7fr auto;gap:8px}input{height:46px;border:1px solid #ddd7e1;border-radius:11px;padding:0 12px;font-size:15px;min-width:0}.btn{border:0;border-radius:11px;background:#4b2586;color:white;padding:0 18px;font-weight:900;font-size:11px}.error{min-height:17px;color:#c84659;font-size:10px;margin-top:8px}
#results{display:none;margin-top:26px}#results.show{display:block}.rh{display:flex;justify-content:space-between;align-items:end;margin:0 3px 10px}.rh h2{margin:0;font-size:18px}.rh span{font-size:10px;color:#89828e}
.card{margin-bottom:10px;overflow:hidden}.card>button{width:100%;border:0;background:white;padding:16px;text-align:left;cursor:pointer}.top{display:flex;justify-content:space-between;gap:10px}.code{font-size:9px;color:#4b2586;font-weight:900}.car{font-size:15px;font-weight:900;margin-top:4px}.meta{font-size:10px;color:#89828e;margin-top:7px}.status{font-size:9px;font-weight:900;color:#4b2586;background:#f6f2fb;border-radius:99px;padding:6px 9px;height:max-content}
.detail{display:none;border-top:1px solid #e8e3eb;padding:17px}.detail.open{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #f0edf2;font-size:11px}.row span{color:#89828e}.price{margin-top:15px;padding:15px;border-radius:13px;background:#4b2586;color:white}.pr{display:flex;justify-content:space-between;font-size:10px;margin:6px 0}.total{border-top:1px solid #ffffff44;padding-top:10px;margin-top:10px;font-size:16px}
.comments{margin-top:17px}.comment{background:#faf9fb;border:1px solid #e8e3eb;border-radius:11px;padding:12px;margin-top:7px;font-size:11px;line-height:1.7}.comment b{color:#4b2586}.empty{color:#89828e;font-size:11px;padding:12px 0}
@media(max-width:650px){.page{padding:20px 8px 40px}form{grid-template-columns:1fr}.btn{height:46px}.grid{grid-template-columns:1fr}h1{font-size:28px}}
</style></head><body><main class="page"><header><small>CARONE CUSTOMER LOOKUP</small><h1>내 견적문의 확인</h1><p>문의번호를 기억하지 않아도 됩니다.<br>견적문의 당시 입력한 전화번호와 조회 비밀번호로 확인하세요.</p></header>
<section class="login"><h2>내 문의 찾기</h2><div class="desc">전화번호와 조회 비밀번호가 모두 일치하는 견적만 표시됩니다.</div>
<form id="f"><input id="phone" type="tel" placeholder="010-1234-5678" required><input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="조회 비밀번호" required><button class="btn" id="btn">내 견적 확인</button></form><div id="error" class="error"></div></section>
<section id="results"><div class="rh"><h2>내 견적문의</h2><span id="count"></span></div><div id="list"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/inquiry-phone.js"></script></body></html>
